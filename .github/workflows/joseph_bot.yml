name: Joseph (rot, Tages-Trader)

on:
  schedule:
    # Zweimal täglich -- Joseph ist der ruhigste der drei Bots.
    - cron: "0 7,16 * * *"
  workflow_dispatch: {}

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy yfinance supabase

      - name: Joseph handelt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python joseph_bot.py
