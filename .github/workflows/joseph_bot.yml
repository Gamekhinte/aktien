name: Joseph (rot, Tages-Trader)

on:
  schedule:
    # Zweimal täglich (UTC): kurz nach XETRA-Eröffnung und kurz vor US-Schluss.
    - cron: "30 7 * * *"
    - cron: "45 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: joseph-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas numpy yfinance supabase

      - name: Joseph handelt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python joseph_bot.py
