name: Jerry (grün, Minuten-Trader)

on:
  schedule:
    # Alle 15 Minuten, rund um die Uhr (GitHub Actions Cron nutzt UTC).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Nie zwei Jerry-Läufe gleichzeitig -- sonst könnten sie sich das Konto überschreiben.
concurrency:
  group: jerry-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas numpy yfinance supabase

      - name: Jerry handelt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python jerry_bot.py
