name: Jan (gelb, Stunden-Trader)

on:
  schedule:
    # Jede Stunde (Minute 5, damit die neue 1h-Kerze bei Yahoo schon da ist).
    - cron: "5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: jan-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas numpy yfinance supabase

      - name: Jan handelt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python jan_bot.py
